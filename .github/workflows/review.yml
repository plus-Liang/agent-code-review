name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "origin/${BASE_REF}" > /dev/null
          # 内容含 NUL 字节的文件会被 git 当二进制：三点 diff 没有任何 hunk，
          # adapter/git_diff.py 会按"二进制文件"跳过它，日志只剩 0 个变更文件。
          # 这里只告警不失败——PR 里合法地新增 png/zip 等资源也属于这种情况。
          binary="$(git diff --numstat "origin/${BASE_REF}...HEAD" | awk '$1 == "-" && $2 == "-" {print $3}')"
          if [ -n "${binary}" ]; then
            echo "::warning::以下文件被 git 当二进制（内容含 NUL 字节），本次审查会跳过：${binary}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python cli.py --base "origin/${{ github.event.pull_request.base.ref }}" --head HEAD

      - name: Post PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/post_review.py --findings findings.json
